[project]
name = "blaggregator"
version = "0.1.0"
description = "A blog aggregator for the Recurse Center community"
authors = [
    { name = "Sasha Laundy", email = "sasha.laundy@gmail.com" },
    { name = "Puneeth Chaganti", email = "punchagan@muse-amuse.in" },
]
requires-python = ">=3.12,<4"
license = "AGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=6.0,<7",
    "requests>=2.26.0,<3",
    "feedparser>=6.0.8,<7",
    "psycopg[binary]>=3.2,<4",
    "social-auth-app-django>=7.2.0,<8",
    "beautifulsoup4>=4.10.0,<5",
    "gevent>=26.9.0,<27",
    "dj-database-url>=0.5.0,<0.6",
    "gunicorn>=26.2.0,<27",
    "lxml>=6.1.3,<7",
    "whitenoise>=6.9,<7",
    "markdownify>=1.2.3,<2",
    "beautifulsoup4>=4.1.8,<5",
]

[dependency-groups]
dev = [
    "mock>=4.0.3,<5",
    "factory-boy>=3.2.0,<4",
    "flake8>=7",
    "coverage>=7.17.2",
    "markdown>=3.11.2",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
