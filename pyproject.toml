[project]
name = "blaggregator"
version = "0.1.0"
description = "A blog aggregator for the Recurse Center community"
authors = [
    { name = "Sasha Laundy", email = "sasha.laundy@gmail.com" },
    { name = "Puneeth Chaganti", email = "punchagan@muse-amuse.in" },
]
requires-python = ">=3.10,<4"
license = "AGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=4.2,<5",
    "requests>=2.26.0,<3",
    "feedparser>=6.0.8,<7",
    "psycopg2>=2.9.1,<3",
    "django-storages>=1.11.1,<2",
    "social-auth-app-django>=5.0.0,<6",
    "beautifulsoup4>=4.10.0,<5",
    "gevent>=26.9.0,<27",
    "dj-database-url>=0.5.0,<0.6",
    "boto3>=1.18.44,<2",
    "gunicorn>=26.2.0,<27",
    "lxml>=6.1.3,<7",
]

[dependency-groups]
dev = [
    "mock>=4.0.3,<5",
    "factory-boy>=3.2.0,<4",
    "flake8>=3.9.2,<4",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
