services:
  db:
    image: postgres:17
    environment:
      # Matches the defaults in blaggregator/settings/base.py, so this DB also
      # works for a non-Docker setup (see docs/development.md).  If 5432 is taken
      # on your machine, run with e.g. `DB_PORT=5433 docker compose up`.
      POSTGRES_USER: sasha
      POSTGRES_PASSWORD: sasha
      POSTGRES_DB: blaggregator_dev
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sasha", "-d", "blaggregator_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Optional: only needed to log in with Recurse Center OAuth
      - path: web-variables.env
        required: false
    environment:
      # DOCKER_ENV selects blaggregator/settings/docker.py (DB host: "db")
      DOCKER_ENV: "1"
      DJANGO_DEBUG: "1"
      # A "log in as dev user" button, so no Recurse credentials are needed
      DEV_LOGIN: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - .:/code

volumes:
  pgdata:
